<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanvi Kale | Photography</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .lightbox-fade { transition: opacity 0.3s ease-in-out; }
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F9DBBD; }
        ::-webkit-scrollbar-thumb { background: #DA627D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #A53860; }
    </style>
</head>
<body class="bg-[#F9DBBD] text-[#450920] font-sans min-h-screen selection:bg-[#FFA5AB] relative">

    <header id="top" class="max-w-7xl mx-auto px-6 pt-16 pb-6 text-center select-none">
        <h1 class="text-4xl md:text-5xl font-light tracking-widest uppercase mb-2">Tanvi Kale</h1>
        <div class="h-[1px] w-24 bg-[#DA627D] mx-auto my-4"></div>
        <p class="text-xs tracking-widest uppercase text-[#A53860]/80 mb-6">Photography Portfolio</p>
        
        <nav class="flex justify-center items-center gap-8 text-xs tracking-widest uppercase font-medium mt-2">
            <a href="index.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Art</a>
            <a href="piano.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Piano</a>
            <a href="photography.html" class="text-[#450920] border-b border-[#450920] pb-1 transition-all">Photography</a>
        </nav>
    </header>

    <main class="max-w-7xl w-full mx-auto px-6 pb-24 pt-8">
        <div id="photography-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
        </div>
    </main>

    <footer class="text-center py-12 border-t border-[#FFA5AB]/30 text-xs tracking-widest uppercase text-[#A53860]/60">
        &copy; 2026 Tanvi Kale. All Rights Reserved.
    </footer>

    <div id="lightbox" class="fixed inset-0 bg-[#450920]/95 z-50 flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none lightbox-fade select-none" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-[#F9DBBD] text-3xl font-light cursor-pointer hover:text-[#FFA5AB] transition-colors">&times;</button>
        <div class="max-w-5xl w-full h-[80vh] flex flex-col items-center justify-center gap-4" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[90%] object-contain border-4 border-[#F9DBBD] bg-[#450920] shadow-2xl">
            <h3 id="lightbox-title" class="text-lg font-light tracking-wide text-[#F9DBBD] mt-2"></h3>
        </div>
    </div>

    <script>
        const totalPhotos = 14;
        const photoContainer = document.getElementById('photography-grid');

        for (let i = 1; i <= totalPhotos; i++) {
            const title = `Photograph ${i}`;
            const card = document.createElement('div');
            card.className = "group cursor-pointer flex flex-col gap-3";
            
            card.innerHTML = `
                <div class="aspect-square w-full overflow-hidden bg-[#450920]/5 border border-[#450920]/10 p-2 shadow-xs group-hover:shadow-md transition-all duration-300 group-hover:border-[#DA627D]">
                    <img id="photo-img-${i}" src="images/photo${i}.jpg" alt="${title}" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.02]" loading="lazy">
                </div>
                <h3 class="text-xs font-light tracking-widest uppercase px-1 text-[#450920]/90 group-hover:text-[#A53860] transition-colors">
                    ${title}
                </h3>
            `;
            photoContainer.appendChild(card);

            const imgElement = document.getElementById(`photo-img-${i}`);
            
            // Hard-coded fallback logic prevents the browser from dropping the "images/" directory folder context
            imgElement.onerror = function() {
                const currentSrc = this.src;
                if (currentSrc.endsWith('.jpg')) {
                    this.src = "./images/photo" + i + ".jpeg";
                }
            };

            card.onclick = () => openLightbox(imgElement.src, title);
        }

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');

        function openLightbox(src, title) {
            lightboxImg.src = src;
            lightboxImg.alt = title;
            lightboxTitle.innerText = title;
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeLightbox() { lightbox.classList.add('opacity-0', 'pointer-events-none'); }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
