<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanvi Kale | Art Portfolio</title>
    
    <meta name="description" content="The selected artwork and painting portfolio of Tanvi Kale.">
    <meta property="og:title" content="Tanvi Kale | Art Portfolio">
    <meta property="og:description" content="A curated digital gallery of fine art by Tanvi Kale.">
    <meta property="og:image" content="images/vertical_page-0001.jpg">
    <meta property="og:type" content="website">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .lightbox-fade { transition: opacity 0.3s ease-in-out; }
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F9DBBD; }
        ::-webkit-scrollbar-thumb { background: #DA627D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #A53860; }
    </style>
</head>
<body class="bg-[#F9DBBD] text-[#450920] font-sans min-h-screen selection:bg-[#FFA5AB] relative">

    <header id="top" class="max-w-7xl mx-auto px-6 pt-16 pb-6 text-center select-none">
        <h1 class="text-4xl md:text-5xl font-light tracking-widest uppercase mb-2">Tanvi Kale</h1>
        <div class="h-[1px] w-24 bg-[#DA627D] mx-auto my-4"></div>
        <p class="text-xs tracking-widest uppercase text-[#A53860]/80 mb-6">Selected Artworks Portfolio</p>
        
        <nav class="flex justify-center items-center gap-8 text-xs tracking-widest uppercase font-medium mt-2">
            <a href="index.html" class="text-[#450920] border-b border-[#450920] pb-1 transition-all">Art</a>
            <a href="piano.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Piano</a>
            <a href="photography.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Photography</a>
        </nav>
    </header>

    <main class="max-w-7xl w-full mx-auto px-6 pb-24">
        
        <section class="mb-20">
            <div class="flex items-center gap-4 mb-8">
                <h2 class="text-xs font-semibold tracking-widest uppercase text-[#A53860]">Vertical Works</h2>
                <div class="flex-grow h-[1px] bg-[#FFA5AB]/40"></div>
            </div>
            <div id="vertical-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-10">
            </div>
        </section>

        <section>
            <div class="flex items-center gap-4 mb-8">
                <h2 class="text-xs font-semibold tracking-widest uppercase text-[#A53860]">Horizontal Works</h2>
                <div class="flex-grow h-[1px] bg-[#FFA5AB]/40"></div>
            </div>
            <div id="horizontal-grid" class="grid grid-cols-1 md:grid-cols-2 gap-10">
            </div>
        </section>

    </main>

    <footer class="text-center py-12 border-t border-[#FFA5AB]/30 text-xs tracking-widest uppercase text-[#A53860]/60">
        &copy; 2026 Tanvi Kale. All Rights Reserved.
    </footer>

    <a href="#top" id="backToTop" class="fixed bottom-8 right-8 bg-[#450920] text-[#F9DBBD] hover:bg-[#A53860] w-10 h-10 rounded-full flex items-center justify-center shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-40 group" title="Back to Top">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:-translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
    </a>

    <div id="lightbox" class="fixed inset-0 bg-[#450920]/95 z-50 flex flex-col items-center justify-center p-4 opacity-0 pointer-events-none lightbox-fade select-none" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-[#F9DBBD] text-3xl font-light cursor-pointer hover:text-[#FFA5AB] transition-colors">&times;</button>
        
        <div class="max-w-5xl w-full h-[80vh] flex flex-col items-center justify-center gap-4" onclick="event.stopPropagation()">
            <div id="lightbox-img-wrapper" class="max-w-full max-h-[90%] flex items-center justify-center overflow-hidden">
                <img id="lightbox-img" src="" alt="" class="object-contain border-4 border-[#F9DBBD] bg-[#450920] shadow-2xl transition-transform duration-200">
            </div>
            <h3 id="lightbox-title" class="text-lg font-light tracking-wide text-[#F9DBBD] mt-2"></h3>
        </div>
    </div>

    <script>
        const paintings = [
            { id: 1, type: 'vertical', title: "Vintage European House and Greenery", img: "images/vertical_page-0001.jpg" },
            { id: 2, type: 'vertical', title: "Abstract Pink and Purple Roses", img: "images/vertical_page-0002.jpg" },
            { id: 3, type: 'vertical', title: "Multicolor European Buildings", img: "images/vertical_page-0003.jpg" },
            { id: 4, type: 'vertical', title: "Abstract Blue Vase with Flowers", img: "images/vertical_page-0004.jpg" },
            { id: 5, type: 'vertical', title: "Mexican House with Blue Door", img: "images/vertical_page-0005.jpg" },
            { id: 6, type: 'vertical', title: "Ocean Blues and Whispy Sky", img: "images/vertical_page-0006.jpg" },
            { id: 7, type: 'vertical', title: "Branch with Fruits and Autumn Leaves", img: "images/vertical_page-0007.jpg", rotate180: true },
            { id: 8, type: 'vertical', title: "Evergreen Trees in Blue-Green Hues", img: "images/vertical_page-0008.jpg" },
            { id: 9, type: 'vertical', title: "Brown House and Mountain Lake", img: "images/vertical_page-0009.jpg" },
            { id: 17, type: 'vertical', title: "Four Roses and Eucalyptus Leaves", img: "images/vertical_page-0010.jpg" }, // Pointed to your newly rotated file!

            { id: 10, type: 'horizontal', title: "UW Cherry Blossom Garden", img: "images/horizontal_page-0001.jpg" },
            { id: 11, type: 'horizontal', title: "Shaded Blue Boat on Blue Water", img: "images/horizontal_page-0002.jpg" },
            { id: 12, type: 'horizontal', title: "Mughal Architecture Silhouettes", img: "images/horizontal_page-0003.jpg" },
            { id: 13, type: 'horizontal', title: "Indian Village with Rickshaw", img: "images/horizontal_page-0004.jpg" },
            { id: 14, type: 'horizontal', title: "Blue Window with Flowers (I)", img: "images/horizontal_page-0005.jpg" },
            { id: 15, type: 'horizontal', title: "Blue Window with Flowers (II)", img: "images/horizontal_page-0006.jpg" },
            { id: 16, type: 'horizontal', title: "Abstract Floral All Over", img: "images/horizontal_page-0007.jpg" },
            { id: 18, type: 'horizontal', title: "Soft Mountainous Landscape and River", img: "images/horizontal_page-0009.jpg" }
        ];

        const verticalGrid = document.getElementById('vertical-grid');
        const horizontalGrid = document.getElementById('horizontal-grid');

        paintings.forEach(art => {
            const card = document.createElement('div');
            card.className = "group cursor-pointer flex flex-col gap-3";
            card.onclick = () => openLightbox(art);

            if (art.type === 'vertical') {
                card.innerHTML = `
                    <div class="aspect-[5/7] w-full overflow-hidden bg-[#450920]/5 border border-[#450920]/10 p-2 shadow-xs group-hover:shadow-md transition-all duration-300 group-hover:border-[#DA627D]">
                        <img src="${art.img}" alt="${art.title}" class="w-full h-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.01] ${art.rotate180 ? 'rotate-180' : ''}" loading="lazy">
                    </div>
                    <h3 class="text-xs font-light tracking-widest uppercase px-1 text-[#450920]/90 group-hover:text-[#A53860] transition-colors truncate">
                        ${art.title}
                    </h3>
                `;
                verticalGrid.appendChild(card);
            } else {
                card.innerHTML = `
                    <div class="aspect-[7/5] w-full overflow-hidden bg-[#450920]/5 border border-[#450920]/10 p-2 shadow-xs group-hover:shadow-md transition-all duration-300 group-hover:border-[#DA627D] flex items-center justify-center">
                        <img src="${art.img}" alt="${art.title}" class="w-[71.4%] h-[140%] min-w-[71.4%] min-h-[140%] object-cover rotate-270 transition-transform duration-500 ease-out group-hover:scale-[1.01]" loading="lazy">
                    </div>
                    <h3 class="text-xs font-light tracking-widest uppercase px-1 text-[#450920]/90 group-hover:text-[#A53860] transition-colors truncate">
                        ${art.title}
                    </h3>
                `;
                horizontalGrid.appendChild(card);
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxTitle = document.getElementById('lightbox-title');

        function openLightbox(art) {
            lightboxImg.src = art.img;
            lightboxImg.alt = art.title;
            lightboxTitle.innerText = art.title;
            
            if (art.type === 'horizontal') {
                lightboxImg.className = "max-w-[55vh] max-h-[75vw] md:max-w-[57vh] md:max-h-[80vw] object-contain border-4 border-[#F9DBBD] bg-[#450920] shadow-2xl rotate-270 my-8";
            } else if (art.rotate180) {
                lightboxImg.className = "max-w-full max-h-[90%] object-contain border-4 border-[#F9DBBD] bg-[#450920] shadow-2xl rotate-180 m-0";
            } else {
                lightboxImg.className = "max-w-full max-h-[90%] object-contain border-4 border-[#F9DBBD] bg-[#450920] shadow-2xl rotate-0 m-0";
            }
            
            lightbox.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeLightbox() { lightbox.classList.add('opacity-0', 'pointer-events-none'); }
        window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
                backToTopBtn.classList.add('opacity-100');
            } else {
                backToTopBtn.classList.remove('opacity-100');
                backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        });
    </script>
</body>
</html>
