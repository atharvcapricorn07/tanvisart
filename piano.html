<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F9DBBD; }
        ::-webkit-scrollbar-thumb { background: #DA627D; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #A53860; }
    </style>
</head>
<body class="bg-[#F9DBBD] text-[#450920] font-sans min-h-screen selection:bg-[#FFA5AB]">

    <header id="top" class="max-w-7xl mx-auto px-6 pt-16 pb-6 text-center select-none">

        <div class="h-[1px] w-24 bg-[#DA627D] mx-auto my-4"></div>
        <p class="text-xs tracking-widest uppercase text-[#A53860]/80 mb-6">Piano Performances</p>
        
        <nav class="flex justify-center items-center gap-8 text-xs tracking-widest uppercase font-medium mt-2">
            <a href="index.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Art</a>
            <a href="piano.html" class="text-[#450920] border-b border-[#450920] pb-1 transition-all">Piano</a>
            <a href="photography.html" class="text-[#A53860]/70 hover:text-[#450920] pb-1 transition-all">Photography</a>

    <main class="max-w-4xl w-full mx-auto px-6 pb-24 pt-8">

                    <video controls class="w-full aspect-video rounded-xs bg-[#450920] shadow-md">
                        <source src="images/video1.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <div class="flex flex-col gap-3">
                <h3 class="text-sm font-light tracking-widest uppercase px-1 text-[#A53860]">Agar Tum Saath Ho</h3>
                <div class="bg-[#450920]/5 border border-[#450920]/10 p-3 shadow-xs rounded-xs hover:border-[#DA627D] transition-colors duration-300">

                        <source src="images/video2.mp4" type="video/mp4">

            <div class="flex flex-col gap-3">
